<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Shaik Abdul Rafiath's social profile" />

    <title>Shaik Abdul Rafiath — Links</title>

    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/profile.css" />
    <link rel="stylesheet" href="./css/buttons.css" />
    <link rel="stylesheet" href="./css/desktop.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>

  <body>
    <!-- Desktop background layer -->
    <div id="desktop-background"></div>

    <!-- Main profile -->
    <main class="profile-page">
      <!-- Profile card -->
      <section class="profile-card">
        <!-- Background image -->
        <div id="profile-background" class="profile-background"></div>

        <!-- Overlay -->
        <div class="profile-overlay"></div>

        <!-- Content -->
        <div class="profile-content">
          <!-- Profile image -->
          <img
            id="profile-image"
            class="profile-image"
            src=""
            alt="Profile picture"
          />

          <!-- Name -->
          <h1 id="profile-name"></h1>

          <!-- Username -->
          <p id="profile-username"></p>

          <!-- Bio -->
          <p id="profile-bio"></p>

          <!-- Social links -->
          <div id="social-links" class="social-links"></div>
        </div>
      </section>
    </main>

    <script src="./js/config.js"></script>
    <script src="./js/backgrounds.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
